<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday!</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #ff9a9e,
                #fad0c4
            );

            overflow: hidden;
        }


        /* START SCREEN */

        .birthday-card {

            background: white;

            width: 90%;
            max-width: 500px;

            padding: 40px;

            text-align: center;

            border-radius: 25px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.2);

        }


        .birthday-card h1 {

            color: #ff4f81;

            margin-bottom: 20px;

        }


        .birthday-card p {

            font-size: 20px;

            color: #555;

            margin-bottom: 25px;

        }


        button {

            border: none;

            padding: 15px 30px;

            border-radius: 30px;

            background: #ff4f81;

            color: white;

            font-size: 18px;

            cursor: pointer;

            transition: 0.3s;

        }


        button:hover {

            transform: scale(1.1);

            background: #ff275f;

        }


        /* SURPRISE */

        #surprise {

            display: none;

            text-align: center;

            z-index: 2;

        }


        #surprise h1 {

            color: #ff4f81;

            font-size: 45px;

            margin-bottom: 15px;

            animation: pop 1s ease;

        }


        /* NAME */

        #name {

            color: #8338ec;

            font-size: 35px;

            margin-bottom: 20px;

        }


        /* CAKE */

        .cake {

            font-size: 100px;

            margin: 20px;

            cursor: pointer;

            animation: bounce 1.5s infinite;

        }


        /* CANDLES */

        .candles {

            font-size: 40px;

            margin-bottom: 5px;

        }


        .flame {

            display: inline-block;

            animation: flame 0.5s infinite alternate;

        }


        .flame.off {

            display: none;

        }


        .instruction {

            color: #555;

            font-size: 18px;

            margin-bottom: 20px;

        }


        /* WISH */

        #wishMessage {

            display: none;

            color: #ff4f81;

            font-size: 22px;

            line-height: 1.6;

            margin-top: 20px;

            animation: pop 1s ease;

        }


        /* MUSIC BUTTON */

        #musicButton {

            position: fixed;

            top: 20px;

            right: 20px;

            padding: 12px 18px;

            font-size: 16px;

            z-index: 10;

        }


        /* CONFETTI */

        .confetti {

            position: absolute;

            width: 10px;

            height: 20px;

            top: -30px;

            animation: fall 4s linear forwards;

        }


        /* HEARTS */

        .heart {

            position: absolute;

            bottom: -50px;

            font-size: 25px;

            animation: heartFloat 5s linear forwards;

        }


        /* ANIMATIONS */

        @keyframes fall {

            0% {
                transform: translateY(0) rotate(0deg);
            }

            100% {
                transform: translateY(110vh) rotate(720deg);
            }

        }


        @keyframes pop {

            0% {
                transform: scale(0);
            }

            80% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }

        }


        @keyframes bounce {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }

        }


        @keyframes flame {

            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.2);
            }

        }


        @keyframes heartFloat {

            0% {
                transform: translateY(0);
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh);
                opacity: 0;
            }

        }

    </style>

</head>


<body>


    <!-- MUSIC -->

    <audio id="birthdayMusic" loop>

        <source
            src="happy-birthday.mp3"
            type="audio/mpeg"
        >

    </audio>


    <button
        id="musicButton"
        onclick="toggleMusic()"
    >
        🎵 Music
    </button>



    <!-- START SCREEN -->

    <div
        class="birthday-card"
        id="startScreen"
    >

        <h1>
            🎁
        </h1>

        <h1>
            A Birthday Surprise!
        </h1>

        <p>
             Prepared  special for you. 💖
        </p>

        <button onclick="openGift()">

            Open Your Gift 🎁

        </button>

    </div>



    <!-- BIRTHDAY SCREEN -->

    <div id="surprise">

        <h1>
            🎉 HAPPY BIRTHDAY! 🎉
        </h1>


        <!-- CHANGE THE NAME HERE -->

        <div id="name">
            Brianna Jane! 💖
        </div>


        <div class="candles">

            <span class="flame">
                🔥
            </span>

            <span class="flame">
                🔥
            </span>

            <span class="flame">
                🔥
            </span>

        </div>


        <div
            class="cake"
            onclick="blowCandles()"
        >
            🎂
        </div>


        <p
            class="instruction"
            id="instruction"
        >
            Click the cake and make a wish! ✨
        </p>


        <button
            id="wishButton"
            onclick="blowCandles()"
        >
            Make a Wish ✨
        </button>


        <div id="wishMessage">

            💨 The candles are out! 💨

            <br><br>

            <span id="typingText"></span>

        </div>

    </div>



    <script>


        /* OPEN GIFT */

        function openGift() {

            document.getElementById(
                "startScreen"
            ).style.display = "none";


            document.getElementById(
                "surprise"
            ).style.display = "block";


            createConfetti();


            createHearts();


            /*
                Start music after the user
                clicks the gift button.
            */

            let music =
                document.getElementById(
                    "birthdayMusic"
                );

            music.play().catch(function() {

                console.log(
                    "Music needs to be started manually."
                );

            });

        }



        /* BLOW CANDLES */

        function blowCandles() {

            let flames =
                document.querySelectorAll(
                    ".flame"
                );


            flames.forEach(function(flame) {

                flame.classList.add("off");

            });


            document.getElementById(
                "instruction"
            ).style.display = "none";


            document.getElementById(
                "wishButton"
            ).style.display = "none";


            document.getElementById(
                "wishMessage"
            ).style.display = "block";


            createConfetti();


            startTyping();

        }



        /* TYPING EFFECT */

        function startTyping() {

            let text =
                "May all your wishes come true! 💖 May your birthday be filled with happiness, laughter, love, success, and beautiful memories! 🥳✨";


            let index = 0;


            let typing =
                document.getElementById(
                    "typingText"
                );


            typing.innerHTML = "";


            function type() {

                if (index < text.length) {

                    typing.innerHTML +=
                        text.charAt(index);

                    index++;

                    setTimeout(
                        type,
                        45
                    );

                }

            }


            type();

        }



        /* MUSIC */

        function toggleMusic() {

            let music =
                document.getElementById(
                    "birthdayMusic"
                );

            let button =
                document.getElementById(
                    "musicButton"
                );


            if (music.paused) {

                music.play();

                button.innerHTML =
                    "🔊 Music ON";

            } else {

                music.pause();

                button.innerHTML =
                    "🔇 Music OFF";

            }

        }



        /* CONFETTI */

        function createConfetti() {

            for (
                let i = 0;
                i < 100;
                i++
            ) {

                let confetti =
                    document.createElement(
                        "div"
                    );


                confetti.classList.add(
                    "confetti"
                );


                confetti.style.left =
                    Math.random() * 100 + "vw";


                confetti.style.animationDuration =
                    (
                        Math.random() * 3 + 2
                    ) + "s";


                confetti.style.width =
                    (
                        Math.random() * 8 + 5
                    ) + "px";


                confetti.style.height =
                    (
                        Math.random() * 15 + 10
                    ) + "px";


                confetti.style.backgroundColor =
                    getRandomColor();


                document.body.appendChild(
                    confetti
                );

            }

        }



        /* HEARTS */

        function createHearts() {

            for (
                let i = 0;
                i < 20;
                i++
            ) {

                let heart =
                    document.createElement(
                        "div"
                    );


                heart.classList.add(
                    "heart"
                );


                heart.innerHTML = "💖";


                heart.style.left =
                    Math.random() * 100 + "vw";


                heart.style.animationDuration =
                    (
                        Math.random() * 4 + 4
                    ) + "s";


                document.body.appendChild(
                    heart
                );

            }

        }



        /* RANDOM CONFETTI COLOR */

        function getRandomColor() {

            let colors = [

                "#ff4f81",
                "#ffd166",
                "#06d6a0",
                "#118ab2",
                "#8338ec"

            ];


            return colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];

        }

    </script>

</body>

</html>
